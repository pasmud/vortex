name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run the test suite
        run: cargo test --workspace

      - name: Check the emitter's type decision covers every expression form
        # Stage 15: a form with no arm in the type decision is what nine of the
        # documented defects were, and two of them arrived through fixing another.
        # This fails the build when a form is unhandled, at the point of change.
        run: cargo test -p vortexc --lib coverage

      - name: Run the interpreter suite against the VM
        # The stage 2 and 3 expectations are run a second time against the
        # virtual machine, so both engines are checked against the same
        # expectations rather than the VM getting a weaker set of its own.
        run: VORTEX_ENGINE=vm cargo test --workspace

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Build with warnings denied
        run: cargo build --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings

      - name: Run the benchmark harness
        run: ./bench/run.sh

      - name: Check the examples agree on all three paths
        # The tree interpreter, the bytecode VM and the compiled path have to
        # produce identical output for every example. An example the emitter
        # refuses is listed with its reason rather than failing, so a refusal by
        # name stays visible.
        run: ./scripts/check-examples.sh

      - name: Fail if BENCHMARKS.md claims a result without a source
        run: ./scripts/check-benchmarks.sh