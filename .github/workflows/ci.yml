name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run the test suite
        run: cargo test --workspace

      - name: Run the interpreter suite against the VM
        # The stage 2 and 3 expectations are run a second time against the
        # virtual machine, so both engines are checked against the same
        # expectations rather than the VM getting a weaker set of its own.
        run: VORTEX_ENGINE=vm cargo test --workspace

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Build with warnings denied
        run: cargo build --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings

      - name: Run the benchmark harness
        run: ./bench/run.sh

      - name: Fail if BENCHMARKS.md claims a result without a source
        run: ./scripts/check-benchmarks.sh